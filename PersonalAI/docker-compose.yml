version: '3.8'

services:
  personalai:
    build: .
    image: personalai:latest
    container_name: personalai
    restart: unless-stopped
    
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ROBOBRAIN_MODEL=BAAI/RoboBrain2.0-7B
      - PERSONALAI_ENV=production
    
    volumes:
      - ./data:/app/data
      - ~/.personalai:/root/.personalai
    
    ports:
      - "8000:8000"
    
    command: python run.py enhanced
    
    healthcheck:
      test: ["CMD", "python", "-c", "from core.monitoring import get_monitoring_system; m=get_monitoring_system(); exit(0 if m.get_system_status()['overall_status']=='healthy' else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Qdrant for long-term memory
  qdrant:
    image: qdrant/qdrant:latest
    container_name: personalai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
