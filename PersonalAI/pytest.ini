[pytest]
# Pytest configuration for PersonalAI

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Coverage (if pytest-cov installed)
# addopts = --cov=core --cov=trading --cov-report=html

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (> 1s)
    requires_gpu: Tests requiring GPU
    requires_mt5: Tests requiring MetaTrader 5

# Directories to ignore
testpaths = tests
norecursedirs = .git .venv __pycache__ *.egg-info

# Minimum Python version
minversion = 3.10
